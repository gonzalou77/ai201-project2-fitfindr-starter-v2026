# Render Blueprint for FitFindr.
#
# One free web service running serve.py — the same run_agent() the CLI calls,
# behind POST /ask and GET /health.
#
# Everything gunicorn needs is in gunicorn.conf.py, which gunicorn loads on
# its own, so the start command here stays the exact one serve.py documents.
#
# To use: Render dashboard → New → Blueprint → pick this repo. Render reads
# this file and prompts for GEMINI_API_KEY.

services:
  - type: web
    name: fitfindr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn serve:app
    healthCheckPath: /health
    envVars:
      # Prompted for once, when the Blueprint is created, and stored by
      # Render. `sync: false` is what keeps the key out of this file and
      # out of git — same rule as .env.
      - key: GEMINI_API_KEY
        sync: false
      # Turn the response cache OFF on the deployed service.
      #
      # With it on (the default), two people asking the same thing get the
      # same caption word for word, because the second request reads the
      # first one's answer off disk. That is what TEMPERATURE = 0.9 exists to
      # prevent. It also made every criterion 5 trial a cache hit, so the
      # timing measured file reads rather than model calls.
      #
      # mcp_client forwards AI201_* to the MCP server process, so this
      # reaches create_fit_card as well as suggest_outfit.
      #
      # The cost is latency: each request now makes two real model calls.
      - key: AI201_CACHE
        value: "0"
